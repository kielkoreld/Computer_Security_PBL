<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#008894"/></marker></defs><rect width="1000" height="100%" fill="white"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="20" y="35" text-anchor="start" font-size="22" fill="#173f4b">기준점과 축을 먼저 맞춰야 서로 다른 센서의 위치를 같은 숫자로 비교할 수 있습니다.</text><text x="130" y="90" text-anchor="middle" font-size="20" fill="#173f4b">원본 자차 기준</text><path d="M130,240 L130,130" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M130,240 L215,240" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="130" cy="240" r="9" fill="#008894"/><text x="138" y="150" text-anchor="start" font-size="17" fill="#173f4b">앞 +X</text><text x="130" y="280" text-anchor="middle" font-size="17" fill="#173f4b">오른쪽 +Y</text><text x="130" y="315" text-anchor="middle" font-size="17" fill="#173f4b">위 +Z</text><text x="380" y="90" text-anchor="middle" font-size="20" fill="#173f4b">변환한 자차 기준</text><path d="M380,240 L380,130" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M380,240 L295,240" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="380" cy="240" r="9" fill="#008894"/><text x="388" y="150" text-anchor="start" font-size="17" fill="#173f4b">앞 +X</text><text x="380" y="280" text-anchor="middle" font-size="17" fill="#173f4b">왼쪽 +Y</text><text x="380" y="315" text-anchor="middle" font-size="17" fill="#173f4b">위 +Z</text><text x="630" y="90" text-anchor="middle" font-size="20" fill="#173f4b">모델 기준</text><path d="M630,240 L630,130" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M630,240 L715,240" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="630" cy="240" r="9" fill="#008894"/><text x="638" y="150" text-anchor="start" font-size="17" fill="#173f4b">앞 +Y</text><text x="630" y="280" text-anchor="middle" font-size="17" fill="#173f4b">오른쪽 +X</text><text x="630" y="315" text-anchor="middle" font-size="17" fill="#173f4b">위 +Z</text><text x="875" y="90" text-anchor="middle" font-size="20" fill="#173f4b">카메라 광학 기준</text><path d="M815,155 L945,155" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M815,155 L815,260" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="815" cy="155" r="9" fill="#008894"/><text x="875" y="137" text-anchor="middle" font-size="16" fill="#173f4b">영상 오른쪽 +X</text><text x="870" y="280" text-anchor="middle" font-size="17" fill="#173f4b">영상 아래 +Y</text><text x="875" y="315" text-anchor="middle" font-size="17" fill="#173f4b">카메라 앞 +Z</text><text x="20" y="380" text-anchor="start" font-size="21" fill="#173f4b">세계 위치 (10,2,1) → (10,−2,1)m. 세계축은 지도 고정축이며 자차 전방과 다릅니다.</text><text x="20" y="425" text-anchor="start" font-size="21" fill="#173f4b">자차·모델 기준은 축뿐 아니라 원점도 다릅니다. 센서 장착 위치·높이를 함께 반영합니다.</text></g></svg>