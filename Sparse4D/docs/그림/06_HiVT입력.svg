<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#008894"/></marker></defs><rect width="1000" height="100%" fill="white"/><g font-family="Noto Sans CJK KR, sans-serif"><rect x="20" y="20" width="460" height="150" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="40" y="55" text-anchor="start" font-size="24" fill="#007e88">세계 위치 → 장면 위치</text><text x="40" y="94" text-anchor="start" font-size="20" fill="#173f4b">현재 자차 위치를 원점으로 빼기</text><text x="40" y="125" text-anchor="start" font-size="20" fill="#173f4b">자차 이동 방향을 장면 +X로 맞추기</text><text x="40" y="156" text-anchor="start" font-size="20" fill="#173f4b">위치 [N,50,2]: 과거20 + 빈 미래30</text><rect x="540" y="20" width="440" height="150" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="560" y="55" text-anchor="start" font-size="24" fill="#007e88">HiVT에 들어가는 이동량</text><text x="560" y="94" text-anchor="start" font-size="20" fill="#173f4b">x [N,20,2] = 인접 위치의 차이</text><text x="560" y="125" text-anchor="start" font-size="20" fill="#173f4b">단위는 m/step, 속도(m/s)가 아님</text><text x="560" y="156" text-anchor="start" font-size="20" fill="#173f4b">이전/현재 칸 결측이면 이동량 0</text><path d="M480,95 L540,95" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="20" y="220" width="460" height="170" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="40" y="255" text-anchor="start" font-size="24" fill="#007e88">마스크: 0과 “모름”을 구별</text><text x="40" y="294" text-anchor="start" font-size="20" fill="#173f4b">padding_mask=True → 해당 칸 결측</text><text x="40" y="325" text-anchor="start" font-size="20" fill="#173f4b">미래 30칸은 모두 True, y=None</text><text x="40" y="356" text-anchor="start" font-size="20" fill="#173f4b">bos_mask → 유효 이력이 새로 시작</text><text x="40" y="387" text-anchor="start" font-size="20" fill="#173f4b">보간된 칸도 여기서는 유효값</text><rect x="540" y="220" width="440" height="170" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="560" y="255" text-anchor="start" font-size="24" fill="#007e88">객체 사이의 관계</text><text x="560" y="294" text-anchor="start" font-size="20" fill="#173f4b">객체 N개 → 방향성 연결 N(N−1)개</text><text x="560" y="325" text-anchor="start" font-size="20" fill="#173f4b">local encoder에서 50m 이웃 제한</text><text x="560" y="356" text-anchor="start" font-size="20" fill="#173f4b">차선 지도는 빈 배열로 전달</text><text x="560" y="387" text-anchor="start" font-size="20" fill="#173f4b">현재 위치가 유효한 대상만 결과 선택</text><text x="20" y="455" text-anchor="start" font-size="21" fill="#173f4b">자차 AV: 실제 10Hz 위치 20개 필요. 마지막 두 위치가 거의 같으면 이 창을 제외합니다.</text><text x="20" y="505" text-anchor="start" font-size="22" fill="#173f4b">대표 입력 N=3 → x [3,20,2], positions [3,50,2], edge_index [2,6]</text></g></svg>