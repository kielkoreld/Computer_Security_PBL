<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#008894"/></marker></defs><rect width="1000" height="100%" fill="white"/><g font-family="Noto Sans CJK KR, sans-serif"><rect x="20" y="20" width="460" height="145" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="40" y="55" text-anchor="start" font-size="24" fill="#007e88">모델 출력</text><text x="40" y="94" text-anchor="start" font-size="20" fill="#173f4b">prediction [6,N,30,4]</text><text x="40" y="125" text-anchor="start" font-size="20" fill="#173f4b">각 값: μx · μy · bx · by</text><text x="40" y="156" text-anchor="start" font-size="20" fill="#173f4b">6가지 미래 · 0.1~3.0초 · 분포 평균/scale</text><rect x="540" y="20" width="440" height="145" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="560" y="55" text-anchor="start" font-size="24" fill="#007e88">모드 점수</text><text x="560" y="94" text-anchor="start" font-size="20" fill="#173f4b">logits [N,6] → softmax → 확률</text><text x="560" y="125" text-anchor="start" font-size="20" fill="#173f4b">확률 최대 모드도 정답 보장은 없음</text><text x="560" y="156" text-anchor="start" font-size="20" fill="#173f4b">bx/by는 표준편차가 아닌 Laplace scale</text><rect x="20" y="220" width="280" height="140" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="40" y="255" text-anchor="start" font-size="24" fill="#007e88">① 객체 방향 풀기</text><text x="40" y="294" text-anchor="start" font-size="20" fill="#173f4b">μ의 회전을 되돌림</text><text x="40" y="325" text-anchor="start" font-size="20" fill="#173f4b">+ 현재 객체 장면 위치</text><rect x="360" y="220" width="280" height="140" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="380" y="255" text-anchor="start" font-size="24" fill="#007e88">② 장면 방향 풀기</text><text x="380" y="294" text-anchor="start" font-size="20" fill="#173f4b">자차 방향 회전 되돌림</text><text x="380" y="325" text-anchor="start" font-size="20" fill="#173f4b">+ 현재 자차 세계 위치</text><rect x="700" y="220" width="280" height="140" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="720" y="255" text-anchor="start" font-size="24" fill="#007e88">③ 세계 XY</text><text x="720" y="294" text-anchor="start" font-size="20" fill="#173f4b">[6,N,30,2] m</text><text x="720" y="325" text-anchor="start" font-size="20" fill="#173f4b">도로 위에 표시할 좌표</text><path d="M300,290 L360,290" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M640,290 L700,290" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="20" y="430" text-anchor="start" font-size="23" fill="#173f4b">저장된 예: mode0의 세계 좌표 (HiVT-64)</text><text x="20" y="475" text-anchor="start" font-size="23" fill="#173f4b">t+0.1초  (−443.512036, −5056.026150)m</text><text x="20" y="515" text-anchor="start" font-size="23" fill="#173f4b">t+3.0초  (−426.276939, −5056.361504)m   ※ 미래 정답이 아닙니다.</text></g></svg>