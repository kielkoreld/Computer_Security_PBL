<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#008894"/></marker></defs><rect width="1000" height="100%" fill="white"/><g font-family="Noto Sans CJK KR, sans-serif"><rect x="20" y="20" width="300" height="150" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="40" y="55" text-anchor="start" font-size="24" fill="#007e88">탐지 박스 [300,10]</text><text x="40" y="94" text-anchor="start" font-size="20" fill="#173f4b">중심 x,y,z / 크기 l,w,h</text><text x="40" y="125" text-anchor="start" font-size="20" fill="#173f4b">yaw / 속도 vx,vy,vz</text><text x="40" y="156" text-anchor="start" font-size="20" fill="#173f4b">+ 별도 클래스·신뢰도</text><rect x="380" y="20" width="260" height="150" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="400" y="55" text-anchor="start" font-size="24" fill="#007e88">공통 세계 위치</text><text x="400" y="94" text-anchor="start" font-size="20" fill="#173f4b">선택·추적한 객체의</text><text x="400" y="125" text-anchor="start" font-size="20" fill="#173f4b">시간별 중심 XY(m)</text><text x="400" y="156" text-anchor="start" font-size="20" fill="#173f4b">박스10값을 붙이지 않음</text><rect x="700" y="20" width="280" height="150" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="720" y="55" text-anchor="start" font-size="24" fill="#007e88">HiVT [N,20,2]</text><text x="720" y="94" text-anchor="start" font-size="20" fill="#173f4b">장면 위치로 변환 후</text><text x="720" y="125" text-anchor="start" font-size="20" fill="#173f4b">인접 위치의 차이</text><text x="720" y="156" text-anchor="start" font-size="20" fill="#173f4b">XY 이동량(m/step)</text><path d="M320,95 L380,95" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M640,95 L700,95" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="20" y="230" text-anchor="start" font-size="22" fill="#173f4b">GT의 9값은 학습용 정답입니다. 위 10값은 탐지 decoder를 거친 출력입니다.</text><text x="20" y="277" text-anchor="start" font-size="22" fill="#173f4b">내부의 log 크기·sin/cos 방향 표현과 실제 내보낸 l,w,h·yaw를 구별합니다.</text><text x="20" y="324" text-anchor="start" font-size="22" fill="#173f4b">박스 크기·Z·yaw·detector 속도·score·class는 HiVT의 x에 추가하지 않습니다.</text></g></svg>