<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#008894"/></marker></defs><rect width="1000" height="100%" fill="white"/><g font-family="Noto Sans CJK KR, sans-serif"><rect x="20" y="20" width="285" height="150" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="40" y="55" text-anchor="start" font-size="24" fill="#007e88">원본 6장</text><text x="40" y="94" text-anchor="start" font-size="20" fill="#173f4b">한 장: 1600 × 900</text><text x="40" y="125" text-anchor="start" font-size="20" fill="#173f4b">가로 × 세로, RGB</text><rect x="357" y="20" width="285" height="150" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="377" y="55" text-anchor="start" font-size="24" fill="#007e88">크기 줄이기</text><text x="377" y="94" text-anchor="start" font-size="20" fill="#173f4b">0.44배 → 704 × 396</text><text x="377" y="125" text-anchor="start" font-size="20" fill="#173f4b">가로·세로 같은 비율</text><rect x="694" y="20" width="285" height="150" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="714" y="55" text-anchor="start" font-size="24" fill="#007e88">아래쪽 영역 자르기</text><text x="714" y="94" text-anchor="start" font-size="20" fill="#173f4b">y=140부터 256줄</text><text x="714" y="125" text-anchor="start" font-size="20" fill="#173f4b">→ 704 × 256</text><path d="M305,95 L357,95" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M642,95 L694,95" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="20" y="225" width="460" height="165" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="40" y="260" text-anchor="start" font-size="24" fill="#007e88">RGB 채널별 정규화</text><text x="40" y="299" text-anchor="start" font-size="20" fill="#173f4b">(화소값 − 평균) ÷ 표준편차</text><text x="40" y="330" text-anchor="start" font-size="20" fill="#173f4b">평균: 123.675 / 116.28 / 103.53</text><text x="40" y="361" text-anchor="start" font-size="20" fill="#173f4b">표준편차: 58.395 / 57.12 / 57.375</text><rect x="545" y="225" width="435" height="165" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="565" y="260" text-anchor="start" font-size="24" fill="#007e88">한 번 호출할 때의 영상 배열</text><text x="565" y="299" text-anchor="start" font-size="20" fill="#173f4b">[B, 6, 3, 256, 704] float32</text><text x="565" y="330" text-anchor="start" font-size="20" fill="#173f4b">배치 · 카메라 · RGB · 높이 · 너비</text><path d="M480,305 L545,305" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="20" y="445" text-anchor="start" font-size="22" fill="#173f4b">투영 행렬도 같은 비율과 잘라낸 위치만큼 바꿔야 3D 박스가 영상과 맞습니다.</text></g></svg>