<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#008894"/></marker></defs><rect width="1000" height="100%" fill="white"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="20" y="35" text-anchor="start" font-size="24" fill="#173f4b">실제 탐지는 0.5초마다, HiVT는 0.1초 간격의 과거 20칸을 사용합니다.</text><text x="20" y="105" text-anchor="start" font-size="22" fill="#173f4b">2Hz 관측</text><text x="20" y="225" text-anchor="start" font-size="22" fill="#173f4b">10Hz 이력</text><circle cx="210" cy="95" r="9" fill="#008894"/><text x="210" y="135" text-anchor="middle" font-size="18" fill="#173f4b">0.0s</text><circle cx="210" cy="215" r="8" fill="#008894"/><path d="M220,215 L265,215" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="278" cy="215" r="8" fill="#eca455"/><path d="M288,215 L333,215" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="346" cy="215" r="8" fill="#eca455"/><path d="M356,215 L401,215" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="414" cy="215" r="8" fill="#eca455"/><path d="M424,215 L469,215" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="482" cy="215" r="8" fill="#eca455"/><path d="M492,215 L537,215" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="550" cy="95" r="9" fill="#008894"/><text x="550" y="135" text-anchor="middle" font-size="18" fill="#173f4b">0.5s</text><circle cx="550" cy="215" r="8" fill="#008894"/><path d="M560,215 L605,215" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="618" cy="215" r="8" fill="#eca455"/><path d="M628,215 L673,215" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="686" cy="215" r="8" fill="#eca455"/><path d="M696,215 L741,215" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="754" cy="215" r="8" fill="#eca455"/><path d="M764,215 L809,215" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="822" cy="215" r="8" fill="#eca455"/><path d="M832,215 L877,215" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><circle cx="890" cy="95" r="9" fill="#008894"/><text x="890" y="135" text-anchor="middle" font-size="18" fill="#173f4b">1.0s</text><circle cx="890" cy="215" r="8" fill="#008894"/><text x="20" y="290" text-anchor="start" font-size="21" fill="#173f4b">● 청록: 실제 관측     ● 주황: 관측 사이의 선형 보간</text><rect x="20" y="325" width="460" height="145" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="40" y="360" text-anchor="start" font-size="24" fill="#007e88">예: 0.5초 (10,2) → 1.0초 (12,2)</text><text x="40" y="399" text-anchor="start" font-size="20" fill="#173f4b">0.6초 위치 = (10.4,2)m</text><text x="40" y="430" text-anchor="start" font-size="20" fill="#173f4b">관측값이 아닌 계산값입니다.</text><rect x="540" y="325" width="440" height="145" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="560" y="360" text-anchor="start" font-size="24" fill="#007e88">긴 누락 구간은 채우지 않음</text><text x="560" y="399" text-anchor="start" font-size="20" fill="#173f4b">간격 &gt; 0.500001초: 사이 칸 결측</text><text x="560" y="430" text-anchor="start" font-size="20" fill="#173f4b">양끝 실제 관측은 그대로 보존</text></g></svg>