<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="495" viewBox="0 0 1000 495"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#008894"/></marker></defs><rect width="1000" height="100%" fill="white"/><g font-family="Noto Sans CJK KR, sans-serif"><rect x="20" y="20" width="280" height="135" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="40" y="55" text-anchor="start" font-size="24" fill="#007e88">원본 객체 주석</text><text x="40" y="94" text-anchor="start" font-size="20" fill="#173f4b">박스 모서리 8개</text><text x="40" y="125" text-anchor="start" font-size="20" fill="#173f4b">객체 ID · 유형 · 관측 여부</text><rect x="360" y="20" width="620" height="135" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="380" y="55" text-anchor="start" font-size="24" fill="#007e88">정답 박스 [Ngt, 9]</text><text x="380" y="94" text-anchor="start" font-size="20" fill="#173f4b">x · y · z  |  l · w · h  |  yaw  |  vx · vy</text><text x="380" y="125" text-anchor="start" font-size="20" fill="#173f4b">중심(m)    크기(m)     방향(rad)   속도(m/s)</text><path d="M300,90 L360,90" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="20" y="205" width="460" height="170" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="40" y="240" text-anchor="start" font-size="24" fill="#007e88">남기는 객체</text><text x="40" y="279" text-anchor="start" font-size="20" fill="#173f4b">차량 50m / 보행자·자전거 등 40m</text><text x="40" y="310" text-anchor="start" font-size="20" fill="#173f4b">카메라 시야와 겹침 + 관측 점 수 &gt; 0</text><text x="40" y="341" text-anchor="start" font-size="20" fill="#173f4b">주차 차량도 같은 조건이면 포함</text><rect x="540" y="205" width="440" height="170" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="560" y="240" text-anchor="start" font-size="24" fill="#007e88">별도로 붙이는 값</text><text x="560" y="279" text-anchor="start" font-size="20" fill="#173f4b">labels [Ngt]: 기존 클래스 번호</text><text x="560" y="310" text-anchor="start" font-size="20" fill="#173f4b">ids [Ngt]: 동일 객체의 정수 ID</text><text x="560" y="341" text-anchor="start" font-size="20" fill="#173f4b">속도 미상: NaN (정지라는 뜻 아님)</text><text x="20" y="435" text-anchor="start" font-size="22" fill="#173f4b">빈 프레임도 [0,9]로 보존합니다. 정답은 이미지 특징이 아니라 손실 계산에 쓰입니다.</text></g></svg>