<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#008894"/></marker></defs><rect width="1000" height="100%" fill="white"/><g font-family="Noto Sans CJK KR, sans-serif"><rect x="20" y="20" width="430" height="125" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="40" y="55" text-anchor="start" font-size="24" fill="#007e88">① 카메라 영상 + 보정 정보</text><text x="40" y="94" text-anchor="start" font-size="20" fill="#173f4b">6장 RGB · 카메라 위치/방향 · 촬영 시각</text><rect x="550" y="20" width="430" height="125" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="570" y="55" text-anchor="start" font-size="24" fill="#007e88">학습할 때만: 정답 박스</text><text x="570" y="94" text-anchor="start" font-size="20" fill="#173f4b">위치·크기·방향·속도 9값 + 클래스</text><path d="M230,145 L230,205" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M760,145 L450,235" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="20" y="205" width="430" height="120" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="40" y="240" text-anchor="start" font-size="24" fill="#007e88">② Sparse4Dv3</text><text x="40" y="279" text-anchor="start" font-size="20" fill="#173f4b">2Hz → 3D 박스 · 클래스 · 신뢰도</text><rect x="550" y="205" width="430" height="120" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="570" y="240" text-anchor="start" font-size="24" fill="#007e88">③ 같은 객체를 이어 붙이기</text><text x="570" y="279" text-anchor="start" font-size="20" fill="#173f4b">세계 XY 위치 → 추적 ID → 0.1초 이력</text><path d="M450,265 L550,265" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M760,325 L760,385" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="550" y="385" width="430" height="120" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="570" y="420" text-anchor="start" font-size="24" fill="#007e88">④ HiVT</text><text x="570" y="459" text-anchor="start" font-size="20" fill="#173f4b">과거 20시점 → 미래 30시점 × 6모드</text><rect x="20" y="385" width="430" height="120" rx="13" fill="#e7f2f2" stroke="#bfd4d6"/><text x="40" y="420" text-anchor="start" font-size="24" fill="#007e88">⑤ 세계 좌표로 복원</text><text x="40" y="459" text-anchor="start" font-size="20" fill="#173f4b">각 객체의 가능한 미래 3초 궤적</text><path d="M550,445 L450,445" stroke="#008894" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="20" y="565" text-anchor="start" font-size="22" fill="#173f4b">탐지의 정답 박스는 학습·평가용입니다. HiVT에는 미래 정답을 넣지 않습니다.</text></g></svg>